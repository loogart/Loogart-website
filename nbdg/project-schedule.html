<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NBDG Project Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: sticky-label week grid that scrolls sideways, detail panel below. */
:root{
  --paper:#fdfaf3; --surface:#f7f1e4; --surface-2:#efe6d3;
  --ink:#121110; --ink-2:#4b453b; --muted:#857c6c; --rule:#e2d8c2;
  --accent:#b07d1e;
  --pause:#efe7d5; --edge:#121110;
  --shadow:0 1px 2px rgba(18,17,16,.07), 0 8px 24px rgba(18,17,16,.09);
  --display:"Oswald","Archivo",Impact,sans-serif;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --colw:118px; --labelw:218px; --rowh:48px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#141210; --surface:#1d1a16; --surface-2:#272219;
  --ink:#f7f1e4; --ink-2:#c3b9a4; --muted:#938976; --rule:#332d24;
  --pause:#201c17; --edge:#6b6052;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141210; --surface:#1d1a16; --surface-2:#272219;
  --ink:#f7f1e4; --ink-2:#c3b9a4; --muted:#938976; --rule:#332d24;
  --pause:#201c17; --edge:#6b6052;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* base palette presets — "cream" is the bare :root above */
:root[data-brand="paper"]{--paper:#ffffff;--surface:#f5f5f4;--surface-2:#ebebe9;--ink:#16161a;--ink-2:#4a4a50;--muted:#7c7c84;--rule:#e3e3e0;--pause:#efefed;--edge:#16161a}
@media (prefers-color-scheme:dark){:root[data-brand="paper"]:not([data-theme="light"]){--paper:#121212;--surface:#1b1b1a;--surface-2:#252523;--ink:#f2f2f0;--ink-2:#bcbcb8;--muted:#8d8d88;--rule:#302f2d;--pause:#1e1e1d;--edge:#6a6a66}}
:root[data-theme="dark"][data-brand="paper"]{--paper:#121212;--surface:#1b1b1a;--surface-2:#252523;--ink:#f2f2f0;--ink-2:#bcbcb8;--muted:#8d8d88;--rule:#302f2d;--pause:#1e1e1d;--edge:#6a6a66}
:root[data-brand="slate"]{--paper:#fbfcfd;--surface:#eef2f6;--surface-2:#e2e8ef;--ink:#121a22;--ink-2:#45535f;--muted:#76838f;--rule:#d8e0e8;--pause:#e8edf2;--edge:#121a22}
@media (prefers-color-scheme:dark){:root[data-brand="slate"]:not([data-theme="light"]){--paper:#0f1419;--surface:#171e26;--surface-2:#1f2830;--ink:#eaf0f6;--ink-2:#aab8c4;--muted:#7d8c99;--rule:#2a3540;--pause:#141b22;--edge:#5d6d7a}}
:root[data-theme="dark"][data-brand="slate"]{--paper:#0f1419;--surface:#171e26;--surface-2:#1f2830;--ink:#eaf0f6;--ink-2:#aab8c4;--muted:#7d8c99;--rule:#2a3540;--pause:#141b22;--edge:#5d6d7a}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}

.head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between}
.headmain{min-width:0;flex:1 1 320px}
.headside{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none}
.logo{height:34px;width:auto;display:block}
.clientname{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--edge);border-radius:9px;padding:4px 11px;display:inline-block}
.mascot{width:clamp(104px,13vw,152px);height:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.inv{filter:invert(1)}}
:root[data-theme="dark"] .logo.inv{filter:invert(1)}
h1{font-family:var(--display);font-size:clamp(28px,5.2vw,42px);font-weight:700;letter-spacing:.005em;line-height:1.02;margin:10px 0 0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--ink-2);font-size:14px;margin-top:8px;max-width:46ch}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.key{background:transparent;border:2px solid var(--edge);border-radius:11px;padding:8px 12px;min-width:98px}
.key b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.key span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 14px;cursor:pointer}
button:hover{background:var(--surface)}
button:focus-visible,[tabindex]:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button[disabled]{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--rule)}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.dot{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- settings ---------- */
.settings{margin-top:14px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:18px}
.settings h3{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.sgrid.wide{grid-template-columns:1fr}
.sblock{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.srow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.srow input[type=text]{flex:1 1 auto}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;flex:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
label.cb{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],textarea,select{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;width:100%;line-height:1.45;font-weight:400}
textarea{resize:vertical;min-height:110px}
input[type=file]{font-family:inherit;font-size:12px;color:var(--ink-2);width:100%}
.thumb{height:34px;width:auto;max-width:150px;display:block;margin-bottom:6px}

/* ---------- chart ---------- */
.chartwrap{margin-top:14px;border:2px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--paper)}
.chart{overflow-x:auto;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch}
.grid{position:relative;min-width:min-content}
.row{position:relative;display:grid;grid-template-columns:var(--labelw) repeat(var(--n),var(--colw));align-items:center;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.head-row{border-bottom:1px solid var(--rule);background:var(--surface)}
.cell{height:var(--rowh);border-right:1px solid var(--rule)}
.cell.pause{background:var(--pause)}
.lbl{position:sticky;left:0;z-index:3;background:var(--paper);border-right:1px solid var(--rule);height:var(--rowh);display:flex;flex-direction:column;justify-content:center;padding:0 12px;gap:1px;min-width:0}
.head-row .lbl{background:var(--surface)}
.lbl .nm{font-size:12.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl .st{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wk{height:var(--rowh);border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;text-align:center}
.wk .d{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.wk .w{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wk.pause{background:var(--pause)}
.wk.pause .d{color:var(--muted);font-weight:500}

.track{position:absolute;z-index:1;left:var(--labelw);right:0;top:0;height:var(--rowh);pointer-events:none}
.bar{position:absolute;top:8px;height:calc(var(--rowh) - 16px);border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:11.5px;font-weight:600;cursor:pointer;border:0;pointer-events:auto;text-align:left;overflow:hidden;white-space:nowrap;font-family:inherit;transition:filter .12s,transform .12s}
.bar:hover{filter:brightness(1.1)}
.bar.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.bar .bt{overflow:hidden;text-overflow:ellipsis}
.bar .ms{flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(0,0,0,.14)}
body.editing .bar{cursor:grab;touch-action:none}
body.editing .bar.dragging{cursor:grabbing;filter:brightness(1.12);transform:scale(1.015)}
.grip{position:absolute;top:0;bottom:0;width:11px;display:none;cursor:ew-resize;touch-action:none}
.grip.l{left:0}.grip.r{right:0}
.grip::after{content:"";position:absolute;top:50%;transform:translateY(-50%);left:4px;width:2px;height:12px;border-radius:2px;background:currentColor;opacity:.55}
body.editing .grip{display:block}
.todayline{position:absolute;top:var(--rowh);bottom:0;width:2px;background:var(--accent);z-index:4;pointer-events:none}
.todayline::before{content:"TODAY";position:absolute;bottom:5px;left:5px;font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--accent);background:var(--paper);padding:1px 3px;border-radius:3px}
.scrollnote{font-size:11.5px;color:var(--muted);margin-top:8px}

.tip{position:fixed;z-index:50;background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.4;pointer-events:none;box-shadow:var(--shadow);max-width:230px}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.tip span{opacity:.72;font-variant-numeric:tabular-nums}

/* ---------- detail ---------- */
.detail{margin-top:22px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:20px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
.dstream{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.detail h2{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.005em;margin:7px 0 0;line-height:1.12;text-wrap:balance}
.drange{font-size:13px;color:var(--ink-2);margin-top:5px;font-variant-numeric:tabular-nums}
.dlab{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
ul.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.dl li{font-size:13.5px;color:var(--ink-2);padding-left:17px;position:relative;line-height:1.45}
ul.dl li::before{content:"";position:absolute;left:0;top:.56em;width:7px;height:2px;border-radius:2px;background:var(--accent)}
.note{margin-top:16px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding-left:12px;line-height:1.5}
.msbox{background:var(--paper);border:2px solid var(--edge);border-radius:12px;padding:14px;margin-top:16px}
.msbox .t{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.msbox .v{font-size:15px;font-weight:600;margin-top:5px}
.msbox .d{font-size:12.5px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.ed{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.danger{color:#a8381f;border-color:#a8381f}
.saverow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.status{font-size:12px;color:var(--muted)}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:820px){
  :root{--colw:96px;--labelw:140px;--rowh:52px}
  .detail{grid-template-columns:1fr;gap:20px;padding:16px}
  .headside{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  .mascot{width:88px}
  .logo{height:28px}
  .lbl{padding:0 10px}
  .lbl .nm{font-size:11.5px;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     SECRET EDIT LINK
     Add this to the end of the address to unlock editing on a static
     host (GitHub Pages and the like):
         https://you.github.io/nbdg-schedule/#edit-this
     Change the word below to whatever you like — it is the only thing
     standing between a visitor and the edit controls.
     ------------------------------------------------------------------ */
  var EDIT_TOKEN = "edit-this";

  var MS = 86400000;
  var state = JSON.parse(document.getElementById("schedule-data").textContent);
  var selected = null, editing = false, dirty = false;
  var artifactCap = null, srcTemplate = null, canEditHere = false, onClaude = false;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  /* migrate older saved shapes */
  if(!state.project){
    state.project = { client:"", title:state.title||"Project Schedule", subtitle:state.subtitle||"",
      weekStart:state.weekStart, weeks:state.weeks, brand:"cream", accent:"#b07d1e",
      logo:"", logoInvert:true, mascot:"", credit:"" };
  }
  if(state.pause && state.pause.on === undefined) state.pause.on = true;
  if(!state.streams) state.streams = {};
  Object.keys(state.streams).forEach(function(k){
    if(typeof state.streams[k] === "string") state.streams[k] = { name:state.streams[k], color:"#888888" };
    if(!state.streams[k].color) state.streams[k].color = "#888888";
  });
  var P = state.project;

  /* ---------------- helpers ---------------- */
  function weekDate(i){
    var p = String(P.weekStart||"2026-01-05").split("-");
    var d = new Date(Date.UTC(+p[0], (+p[1]||1)-1, +p[2]||1));
    d.setUTCDate(d.getUTCDate() + i*7);
    return d;
  }
  function fmt(d){ return MON[d.getUTCMonth()] + " " + d.getUTCDate(); }
  function weekLabel(i){ var a = weekDate(i), b = new Date(a.getTime() + 4*MS); return fmt(a) + "–" + (a.getUTCMonth()===b.getUTCMonth() ? b.getUTCDate() : fmt(b)); }
  function phaseRange(p){ return fmt(weekDate(p.start)) + " – " + fmt(new Date(weekDate(p.start + p.span - 1).getTime() + 4*MS)); }
  function inPause(i){ var q = state.pause; return q && q.on && i >= q.start && i < q.start + q.span; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
  function stream(k){ return state.streams[k] || { name:k, color:"#888888" }; }
  function fgOn(hex){
    var h = String(hex||"#888").replace("#","");
    if(h.length === 3) h = h.split("").map(function(c){ return c+c; }).join("");
    function lin(v){ v = parseInt(v,16)/255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }
    var L = .2126*lin(h.slice(0,2)) + .7152*lin(h.slice(2,4)) + .0722*lin(h.slice(4,6));
    return L > 0.42 ? "#17140f" : "#fbf7ef";
  }

  /* ---------------- render ---------------- */
  function applyBrand(){
    var r = document.documentElement;
    if(P.brand && P.brand !== "cream") r.setAttribute("data-brand", P.brand); else r.removeAttribute("data-brand");
    if(P.accent) r.style.setProperty("--accent", P.accent);
    document.getElementById("h-logo").innerHTML = P.logo

  function renderHead(){

    state.phases.forEach(function(p){ if(p.milestone && /launch|go.?live/i.test(p.milestone.label)) launch = p.milestone; });
    var lp = state.phases.filter(function(p){ return p.milestone && /launch|go.?live/i.test(p.milestone.label); })[0];
    var span = lp ? lp.start + lp.span : state.phases.reduce(function(m,p){ return Math.max(m, p.start + p.span); }, 0);
    var keys = [["Start", fmt(weekDate(0))], ["Go live", launch ? launch.date.replace(/^\w+ /,"") : "—"], ["Weeks to launch", String(span)]];
    document.getElementById("h-keys").innerHTML = keys.map(function(k){
      return '<div class="key"><b>' + esc(k[1]) + '</b><span>' + esc(k[0]) + '</span></div>';
    }).join("");
    document.getElementById("foot-l").textContent = [P.client, P.credit].filter(Boolean).join("  ·  ");
    var n = new Date();
    document.getElementById("foot-r").textContent = "Last updated " + MON[n.getMonth()] + " " + n.getDate() + ", " + n.getFullYear();
  }

  function renderLegend(){
    var used = {};
    state.phases.forEach(function(p){ used[p.stream] = true; });
    var out = Object.keys(state.streams).filter(function(k){ return used[k]; }).map(function(k){
      return '<span class="lg"><i class="dot" style="background:' + esc(stream(k).color) + '"></i>' + esc(stream(k).name) + '</span>';
    }).join("");
    if(state.pause && state.pause.on) out += '<span class="lg"><i class="dot" style="background:var(--pause);border:1px solid var(--rule)"></i>' + esc(state.pause.label) + '</span>';
    out += '<span class="lg"><i class="dot" style="background:var(--accent);width:3px;border-radius:2px"></i>Today</span>';
    document.getElementById("legend").innerHTML = out;
  }

  function renderGrid(){
    var g = document.getElementById("grid");
    g.style.setProperty("--n", P.weeks);
    var W = P.weeks;
    var h = '<div class="row head-row"><div class="lbl"><span class="nm">Phase</span><span class="st">' + W + ' weeks</span></div>';
    for(var i=0;i<W;i++){
      h += '<div class="wk' + (inPause(i)?" pause":"") + '"><span class="d">' + esc(weekLabel(i)) + '</span><span class="w">' + (inPause(i) ? esc((state.pause.label||"Pause").split(" ")[0]) : "Wk " + (i+1)) + '</span></div>';
    }
    h += '</div>';
    state.phases.forEach(function(p){
      var col = stream(p.stream).color, fg = fgOn(col);
      h += '<div class="row"><div class="lbl"><span class="nm">' + esc(p.name) + '</span><span class="st">' + esc(stream(p.stream).name) + '</span></div>';
      for(var j=0;j<W;j++) h += '<div class="cell' + (inPause(j)?" pause":"") + '"></div>';
      h += '<div class="track"><button class="bar' + (selected===p.id?" sel":"") + '" data-id="' + esc(p.id) + '" type="button" style="background:' + esc(col) + ';color:' + fg + '" aria-pressed="' + (selected===p.id) + '">';
      h += (p.milestone ? '<i class="ms"></i>' : "") + '<span class="bt">' + esc(p.short || p.name) + '</span>';
      h += '<i class="grip l" data-grip="l"></i><i class="grip r" data-grip="r"></i></button></div></div>';
    });
    g.innerHTML = h;
    positionBars(); placeToday();
  }

  function metrics(){
    var cells = document.querySelectorAll(".head-row .wk");
    if(!cells.length) return null;
    return { left: cells[0].offsetLeft, colw: cells.length > 1 ? (cells[1].offsetLeft - cells[0].offsetLeft) : cells[0].offsetWidth };
  }
  function positionBars(){
    var m = metrics(); if(!m) return;
    state.phases.forEach(function(p){
      var bar = document.querySelector('.bar[data-id="' + p.id + '"]'); if(!bar) return;
      bar.style.left = (p.start * m.colw + 3) + "px";
      bar.style.width = (p.span * m.colw - 6) + "px";
    });
  }
  function placeToday(){
    var g = document.getElementById("grid");
    var old = g.querySelector(".todayline"); if(old) old.remove();
    var m = metrics(); if(!m) return;
    var now = new Date();
    var days = (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - weekDate(0).getTime()) / MS;
    if(days < 0 || days > P.weeks * 7) return;
    var line = document.createElement("div");
    line.className = "todayline";
    line.style.left = (m.left + (days/7) * m.colw) + "px";
    g.appendChild(line);
  }

  function loadImage(file, maxpx, cb){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var sc = Math.min(1, maxpx / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/png"));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function renderAll(){ applyBrand(); renderHead(); renderLegend(); renderGrid(); renderDetail(); renderBar(); }

  /* ---------------- selection + tooltip ---------------- */
  var tip = null, dragging = null, justDragged = false;
  function showTip(bar, x, y){
    var p = state.phases.filter(function(z){ return z.id === bar.dataset.id; })[0]; if(!p) return;
    if(!tip){ tip = document.createElement("div"); tip.className = "tip"; document.body.appendChild(tip); }
    var n = (p.deliverables||[]).length;
    tip.innerHTML = "<b>" + esc(p.name) + "</b><span>" + esc(phaseRange(p)) + " · " + n + " deliverable" + (n===1?"":"s") + "</span>";
    var w = tip.offsetWidth || 200;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w/2)) + "px";
    tip.style.top = Math.max(8, y - tip.offsetHeight - 12) + "px";
  }
  function hideTip(){ if(tip){ tip.remove(); tip = null; } }

  var G = document.getElementById("grid");
  G.addEventListener("mouseover", function(e){
    var b = e.target.closest(".bar"); if(!b || dragging) return;
    var r = b.getBoundingClientRect(); showTip(b, r.left + r.width/2, r.top); });
  G.addEventListener("mouseout", function(e){ if(e.target.closest(".bar")) hideTip(); });
  G.addEventListener("click", function(e){
    var b = e.target.closest(".bar"); if(!b || justDragged) return;
    selected = b.dataset.id; renderGrid(); renderDetail();
    document.getElementById("detail").scrollIntoView({ behavior:"smooth", block:"nearest" }); });

  G.addEventListener("pointerdown", function(e){
    if(!editing) return;
    var bar = e.target.closest(".bar"); if(!bar) return;
    var p = state.phases.filter(function(z){ return z.id === bar.dataset.id; })[0]; if(!p) return;
    var m = metrics(); if(!m) return;
    var grip = e.target.closest(".grip");
    dragging = { p:p, bar:bar, mode: grip ? ("resize-" + grip.dataset.grip) : "move",
                 x0:e.clientX, s0:p.start, n0:p.span, colw:m.colw, moved:false };
    bar.classList.add("dragging"); bar.setPointerCapture(e.pointerId); hideTip(); e.preventDefault(); });
  G.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var d = Math.round((e.clientX - dragging.x0) / dragging.colw);
    if(d !== 0) dragging.moved = true;
    var p = dragging.p, max = P.weeks;
    if(dragging.mode === "move"){ p.start = Math.max(0, Math.min(max - dragging.n0, dragging.s0 + d)); p.span = dragging.n0; }
    else if(dragging.mode === "resize-r"){ p.span = Math.max(1, Math.min(max - p.start, dragging.n0 + d)); }
    else { var ns = Math.max(0, Math.min(dragging.s0 + dragging.n0 - 1, dragging.s0 + d)); p.span = dragging.n0 + (dragging.s0 - ns); p.start = ns; }
    positionBars(); });
  function endDrag(){
    if(!dragging) return;
    dragging.bar.classList.remove("dragging");
    if(dragging.moved){ markDirty(); justDragged = true; setTimeout(function(){ justDragged = false; }, 60); }
    var p = dragging.p; dragging = null;
    selected = p.id; renderGrid(); renderDetail(); }
  G.addEventListener("pointerup", endDrag);
  G.addEventListener("pointercancel", endDrag);
  G.addEventListener("keydown", function(e){
    var bar = e.target.closest(".bar"); if(!bar || !editing) return;
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var p = state.phases.filter(function(z){ return z.id === bar.dataset.id; })[0]; if(!p) return;
    var d = e.key === "ArrowLeft" ? -1 : 1;
    if(e.shiftKey) p.span = Math.max(1, Math.min(P.weeks - p.start, p.span + d));
    else p.start = Math.max(0, Math.min(P.weeks - p.span, p.start + d));
    markDirty(); selected = p.id; renderGrid(); renderDetail();
    var nb = document.querySelector('.bar[data-id="' + p.id + '"]'); if(nb) nb.focus();
    e.preventDefault(); });

  function renderBar(){

    if(!editing){ host.textContent = base; return; }
    host.innerHTML = '<span class="hint">Drag a bar to move it, drag its edges to resize. Arrow keys nudge, Shift + arrows resize.</span> ' +
      '<span style="display:inline-flex;gap:8px;align-items:center;margin-left:10px;vertical-align:middle">' +
      '<button type="button" id="btn-add">Add phase</button>' +
      '<button type="button" id="btn-save" class="primary"' + (dirty?"":" disabled") + '>' +
        (dirty ? (artifactCap ? "Save changes" : "Download updated page") : (artifactCap ? "Saved" : "Up to date")) + '</button>' +
      '<span class="status" id="savestatus"></span></span>';
    var add = document.getElementById("btn-add");
    if(add) add.addEventListener("click", function(){
      var id = "p" + Date.now().toString(36);
      var k = Object.keys(state.streams)[0] || "brand";
      state.phases.push({ id:id, name:"New phase", short:"New", stream:k, start:0, span:1, deliverables:["Add a deliverable"] });
      selected = id; markDirty(); renderAll(); });
    var save = document.getElementById("btn-save");
    if(save) save.addEventListener("click", doSave);
  }
  function status(msg){ var s = document.getElementById("savestatus"); if(s) s.textContent = msg; }

  function buildHtml(){
    var re = /(<script type="application\/json" id="schedule-data">)[\s\S]*?(<\/script>)/;
    if(!srcTemplate || !re.test(srcTemplate)) return null;
    var json = JSON.stringify(state, null, 2);
    var html = srcTemplate.replace(re, function(_, a, b){ return a + "\n" + json + "\n" + b; });
    return html.replace(/<title>[\s\S]*?<\/title>/, "<title>" + esc(document.title) + "</title>");
  }

  function downloadHtml(html){
    var url = URL.createObjectURL(new Blob([html], { type:"text/html" }));
    var a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  async function doSave(){
    var html = buildHtml();
    if(!html){ status("Could not read the page source — reload and try again."); return; }
    if(!artifactCap){
      downloadHtml(html);
      srcTemplate = html; dirty = false; renderBar();
      status("Downloaded index.html — commit it to publish the change.");
      return;
    }
    status("Saving…");
    try{
      await artifactCap.publish(html);
      srcTemplate = html; dirty = false; renderBar(); status("Saved for everyone.");
    }catch(err){
      var code = err && err.code ? err.code : "";
      if(code === "conflict") status("Someone else saved first — this view will reload.");
      else if(code === "not_writer" || code === "not_granted") status("You have read-only access.");
      else status("Save failed. Try again.");
    }
  }

  /* ---------------- boot ---------------- */
  state.weeks = P.weeks = P.weeks || state.weeks || 12;
  renderAll();
  window.addEventListener("resize", function(){ positionBars(); placeToday(); });

  document.getElementById("btn-today").addEventListener("click", function(){
    var m = metrics(); if(!m) return;
    var now = new Date();
    var days = (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - weekDate(0).getTime()) / MS;
    document.getElementById("chart").scrollTo({ left: Math.max(0, Math.max(0, Math.floor(days/7)) * m.colw - m.colw), behavior:"smooth" });
  });
  document.getElementById("btn-edit").addEventListener("click", function(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    this.classList.toggle("on", editing);
    this.textContent = editing ? "Done editing" : "Edit schedule";
    renderSettings(); renderDetail(); renderBar();
  });

  (function(){
    var now = new Date();
    var wk = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - weekDate(0).getTime()) / MS / 7);
    var hit = state.phases.filter(function(p){ return wk >= p.start && wk < p.start + p.span; })[0];
    selected = (hit || state.phases[0] || {}).id || null;
    renderGrid(); renderDetail();
  })();

  function hashUnlocked(){
    try{ return decodeURIComponent((location.hash || "").replace(/^#/, "")).toLowerCase() === EDIT_TOKEN.toLowerCase(); }
    catch(e){ return false; }
  }
  function refreshEditGate(){
    var btn = document.getElementById("btn-edit");
    var allowed = !!srcTemplate && (onClaude ? canEditHere : hashUnlocked());
    btn.hidden = !allowed;
    if(!allowed && editing){
      editing = false;
      document.body.classList.remove("editing");
      btn.classList.remove("on"); btn.textContent = "Edit schedule";
      renderSettings(); renderDetail(); renderBar();
    }
  }
  window.addEventListener("hashchange", refreshEditGate);

  (async function(){
    onClaude = !!(window.claude && window.claude.use);
    try{ var res = await fetch("index.html", { cache:"no-store" }); if(res.ok) srcTemplate = await res.text(); }catch(e){}
    if(!srcTemplate){ try{ var r2 = await fetch(location.href, { cache:"no-store" }); if(r2.ok) srcTemplate = await r2.text(); }catch(e){} }
    if(onClaude){
      try{ var user = await window.claude.use("user"); canEditHere = user ? await user.canEdit() : false; }catch(e){}
      try{ artifactCap = await window.claude.use("artifact"); }catch(e){ artifactCap = null; }
      if(!artifactCap) canEditHere = false;
    }
    refreshEditGate();
  })();
})();
</script>

</body></html>
